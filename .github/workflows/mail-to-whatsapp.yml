name: Mail to WhatsApp

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to save state.json

concurrency:
  group: mail-to-whatsapp
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run forwarder
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python mail_to_whatsapp.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase || true
            git push
          fi
